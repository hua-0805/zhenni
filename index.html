<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肖珍妮 生日快乐</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: #fef7ff;
        }

        /* 1. 密码弹窗样式（第一个画面） */
        #passwordModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffcee5, #ffb6c1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(255, 105, 180, 0.3);
            text-align: center;
            z-index: 1000;
        }

        #passwordModal .name-title {
            font-size: 28px;
            color: #d63384;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        #passwordModal .password-input {
            width: 200px;
            height: 40px;
            padding: 0 15px;
            border: 2px solid #ff69b4;
            border-radius: 25px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }

        #passwordModal .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        #passwordModal .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            background-color: #ff69b4;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #passwordModal .btn:hover {
            background-color: #d63384;
            transform: scale(1.05);
        }

        /* 2. 气泡祝福容器（第二个画面） */
        #bubblesContainer {
            display: none;
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #fef7ff;
            padding: 20px;
            overflow: hidden;
        }

        /* HelloKitty风格渐变聊天气泡 */
        .birthday-bubble {
            position: absolute;
            background: linear-gradient(120deg, #fff0f5, #ffd1dc);
            border-radius: 18px;
            padding: 15px 20px;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.2);
            color: #d63384;
            font-size: 14px;
            font-weight: 500;
            animation: popIn 0.5s ease forwards;
            opacity: 0;
            transform: scale(0.8);
            z-index: 100;
            /* HelloKitty小装饰 */
            border-left: 4px solid #ff69b4;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff69b433"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>');
            background-repeat: no-repeat;
            background-position: top right 8px;
            background-size: 20px;
        }

        /* 气泡弹出动画 */
        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 3. 粒子文字容器（第三个画面） */
        #particleContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fef7ff;
            z-index: 200;
        }

        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- 第一个画面：密码弹窗 -->
    <div id="passwordModal">
        <div class="name-title">肖珍妮</div>
        <input type="password" class="password-input" id="passwordInput" placeholder="请输入密码">
        <div class="btn-group">
            <button class="btn" id="confirmBtn">确定</button>
            <button class="btn" id="cancelBtn">取消</button>
        </div>
    </div>

    <!-- 第二个画面：HelloKitty气泡祝福 -->
    <div id="bubblesContainer"></div>

    <!-- 第三个画面：粒子聚焦文字 -->
    <div id="particleContainer">
        <canvas id="particleCanvas"></canvas>
    </div>

    <script>
        // ========== 元素获取 ==========
        const passwordModal = document.getElementById('passwordModal');
        const bubblesContainer = document.getElementById('bubblesContainer');
        const particleContainer = document.getElementById('particleContainer');
        const passwordInput = document.getElementById('passwordInput');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        // 适配屏幕的canvas尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ========== 密码验证逻辑 ==========
        const correctPassword = '0201'; // 生日密码0201
        confirmBtn.addEventListener('click', () => {
            const inputPwd = passwordInput.value.trim();
            if (inputPwd === correctPassword) {
                passwordModal.style.display = 'none';
                bubblesContainer.style.display = 'block';
                generateBubbles(); // 生成气泡祝福
            } else {
                alert('密码错误，请重新输入！');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        // 取消按钮也跳转（若需修改取消行为，可调整此处）
        cancelBtn.addEventListener('click', () => {
            passwordModal.style.display = 'none';
            bubblesContainer.style.display = 'block';
            generateBubbles();
        });

        // ========== 30组生日祝福文案 ==========
        const birthdayWishes = [
            "肖珍妮，生日快乐🎂！天天都有小美好～",
            "珍妮宝贝，0201生日快乐✨！永远可爱～",
            "祝肖珍妮生日快乐🎈！Hellokitty陪你过生日～",
            "肖珍妮，生日嗨皮🥳！愿你永远少女心～",
            "珍妮酱，生日快乐🎁！甜品和快乐都给你～",
            "肖珍妮，生日快乐🌟！所有美好都奔向你～",
            "祝可爱的肖珍妮生日快乐🎊！平安喜乐～",
            "肖珍妮，生日快乐💖！Hellokitty为你祝福～",
            "珍妮宝贝，生日快乐🥰！岁岁年年都开心～",
            "肖珍妮，生日快乐🎀！蝴蝶结和快乐都属于你～",
            "祝肖珍妮生日快乐🍰！每天都甜滋滋～",
            "珍妮小可爱，生日快乐🎉！永远没烦恼～",
            "肖珍妮，生日快乐💐！春风都为你温柔～",
            "珍妮宝贝，生日快乐🍬！甜度满分的一天～",
            "肖珍妮，生日快乐🥳！今天你是小主角～",
            "祝肖珍妮生日快乐✨！万事顺意，平安喜乐～",
            "肖珍妮，生日快乐🎈！Hellokitty和你一起庆祝～",
            "珍妮宝贝，生日快乐🎂！新的一岁更可爱～",
            "肖珍妮，生日快乐💝！所有美好如期而至～",
            "珍妮小可爱，生日快乐🎊！笑口常开～",
            "肖珍妮，生日快乐🌟！做永远的小公主～",
            "祝肖珍妮生日快乐🎁！愿望都能实现～",
            "肖珍妮，生日快乐💖！少女心永不打烊～",
            "珍妮宝贝，生日快乐🥳！生日专属快乐～",
            "肖珍妮，生日快乐🎀！粉粉嫩嫩过生日～",
            "祝肖珍妮生日快乐🍰！甜蜜围绕你～",
            "肖珍妮，生日快乐🎈！快乐加载100%～",
            "珍妮小可爱，生日快乐✨！好运连连～",
            "肖珍妮，生日快乐💐！新岁一路繁花～",
            "珍妮宝贝，生日快乐🥰！生日快乐我的宝～"
        ];

        // ========== 生成30个气泡（逐个弹出，不遮挡） ==========
        function generateBubbles() {
            const containerWidth = bubblesContainer.offsetWidth;
            const containerHeight = bubblesContainer.offsetHeight;
            const bubbleCount = 30;
            const bubblePositions = []; // 记录已有气泡位置，避免重叠

            for (let i = 0; i < bubbleCount; i++) {
                setTimeout(() => {
                    // 创建气泡元素
                    const bubble = document.createElement('div');
                    bubble.className = 'birthday-bubble';
                    bubble.textContent = birthdayWishes[i];

                    // 随机气泡尺寸（可爱风小尺寸）
                    const bubbleWidth = Math.floor(Math.random() * 100) + 150;
                    const bubbleHeight = Math.floor(Math.random() * 40) + 60;
                    bubble.style.width = `${bubbleWidth}px`;
                    bubble.style.minHeight = `${bubbleHeight}px`;

                    // 随机位置（避免超出屏幕+和已有气泡保持间距）
                    let x, y;
                    let isValidPosition = false;
                    let attempts = 0;

                    while (!isValidPosition && attempts < 20) {
                        x = Math.floor(Math.random() * (containerWidth - bubbleWidth - 40)) + 20;
                        y = Math.floor(Math.random() * (containerHeight - bubbleHeight - 40)) + 20;
                        isValidPosition = true;

                        // 检查间距（最小100px）
                        for (const pos of bubblePositions) {
                            const dx = x - pos.x;
                            const dy = y - pos.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < 100) {
                                isValidPosition = false;
                                break;
                            }
                        }
                        attempts++;
                    }

                    // 设置位置并记录
                    bubble.style.left = `${x}px`;
                    bubble.style.top = `${y}px`;
                    bubblePositions.push({ x, y, width: bubbleWidth, height: bubbleHeight });

                    // 添加到容器
                    bubblesContainer.appendChild(bubble);

                    // 30个气泡生成完毕后，2秒跳转到粒子画面
                    if (i === bubbleCount - 1) {
                        setTimeout(() => {
                            bubblesContainer.style.display = 'none';
                            particleContainer.style.display = 'block';
                            initParticles(); // 初始化粒子效果
                        }, 2000);
                    }
                }, i * 300); // 每隔300ms生成一个气泡
            }
        }

        // ========== 粒子聚焦文字效果 ==========
        let particles = [];
        const particleCount = 2000; // 粒子数量（越多效果越密）
        const text1 = "肖珍妮"; // 上行文字
        const text2 = "happybirthday"; // 下行文字

        // 初始化粒子
        function initParticles() {
            particles = [];
            // 文字居中位置计算
            const text1Font = `80px Microsoft YaHei`;
            const text2Font = `60px Microsoft YaHei`;
            ctx.font = text1Font;
            const text1X = (canvas.width - ctx.measureText(text1).width) / 2;
            const text1Y = canvas.height / 2 - 50;
            ctx.font = text2Font;
            const text2X = (canvas.width - ctx.measureText(text2).width) / 2;
            const text2Y = canvas.height / 2 + 50;

            // 创建离屏canvas获取文字像素点
            const offscreenCanvas = document.createElement('canvas');
            const offscreenCtx = offscreenCanvas.getContext('2d');
            offscreenCanvas.width = canvas.width;
            offscreenCanvas.height = canvas.height;
            offscreenCtx.font = text1Font;
            offscreenCtx.fillText(text1, text1X, text1Y);
            offscreenCtx.font = text2Font;
            offscreenCtx.fillText(text2, text2X, text2Y);
            const imageData = offscreenCtx.getImageData(0, 0, canvas.width, canvas.height).data;

            // 收集文字像素点
            const textPixels = [];
            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const index = (y * canvas.width + x) * 4;
                    if (imageData[index + 3] > 0) { // 仅收集有文字的像素
                        textPixels.push({ x, y });
                    }
                }
            }

            // 生成粒子并分配目标位置
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: (Math.random() - 0.5) * 2,
                    targetX: textPixels[i % textPixels.length].x,
                    targetY: textPixels[i % textPixels.length].y,
                    color: `rgba(${255}, ${105}, ${180}, ${Math.random() * 0.8 + 0.2})` // 粉色系粒子
                });
            }

            // 启动粒子动画
            animateParticles();
        }

        // 粒子动画循环
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                // 粒子向目标位置移动（缓动效果）
                p.x += (p.targetX - p.x) * 0.05;
                p.y += (p.targetY - p.y) * 0.05;

                // 绘制粉色粒子
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animateParticles);
        }
    </script>
</body>
</html>
